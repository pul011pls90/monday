<!doctype html>
<html lang="{{ CURRENT_LANG }}" data-theme="{{ THEME }}"{% if THEME_AUTO %} data-theme-auto{% endif %}{% if PREFS.text == 'large' %} data-text="large"{% endif %}{% if PREFS.motion == 'reduce' %} data-motion="reduce"{% endif %}{% if PREFS.calc_open %} data-calc-auto{% endif %}>
<head>
  <meta charset="utf-8">
  {% if THEME_AUTO %}<script>(function(){var d=document.documentElement,m=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)");function f(){if(d.hasAttribute("data-theme-auto"))d.setAttribute("data-theme",m&&m.matches?"dark":"light")}f();m&&m.addEventListener&&m.addEventListener("change",f)})();</script>{% endif %}
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Monday{% endblock %} · Monday</title>
  <meta name="theme-color" content="{{ '#000000' if THEME == 'dark' else '#F7F8FB' }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/katex/katex.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/monday.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/brand.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="any">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon-32.png') }}" type="image/png" sizes="32x32">
  <link rel="icon" href="{{ url_for('static', filename='img/icon-192.png') }}" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-confirm-ok="{{ _('Да') }}" data-confirm-cancel="{{ _('Отмена') }}">
  {% block body %}{% endblock %}
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="{{ _('Рисунок') }}"><img alt=""></div>
  <script defer src="{{ url_for('static', filename='vendor/katex/katex.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/katex/contrib/auto-render.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
