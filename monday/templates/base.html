<!doctype html>
<html lang="{{ CURRENT_LANG }}" data-theme="{{ THEME }}"{% if THEME_AUTO %} data-theme-auto{% endif %}{% if PREFS.text == 'large' %} data-text="large"{% endif %}{% if PREFS.motion == 'reduce' %} data-motion="reduce"{% endif %}{% if PREFS.calc_open %} data-calc-auto{% endif %}>
<head>
  <meta charset="utf-8">
  {% if THEME_AUTO %}<script>(function(){var d=document.documentElement,m=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)");function f(){if(d.hasAttribute("data-theme-auto"))d.setAttribute("data-theme",m&&m.matches?"dark":"light")}f();m&&m.addEventListener&&m.addEventListener("change",f)})();</script>{% endif %}
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Monday{% endblock %} · Monday</title>
  <meta name="theme-color" content="{{ '#0A0A0A' if THEME == 'dark' else '#FFFFFF' }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/katex/katex.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/monday.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/brand.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="any">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon-32.png') }}" type="image/png" sizes="32x32">
  <link rel="icon" href="{{ url_for('static', filename='img/icon-192.png') }}" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}"
      data-user-id="{{ current_user.id if current_user.is_authenticated else '' }}"
      data-app-version="{{ config.APP_VERSION }}"
      data-site-status-url="{{ url_for('deploy_safety.api_site_status') }}"
      data-version-url="{{ url_for('deploy_safety.api_version') }}"
      data-confirm-ok="{{ _('Да') }}" data-confirm-cancel="{{ _('Отмена') }}"
      data-date-empty="{{ _('Выбрать дату') }}" data-date-today="{{ _('Сегодня') }}" data-date-clear="{{ _('Очистить') }}" data-date-prev="{{ _('Предыдущий месяц') }}" data-date-next="{{ _('Следующий месяц') }}">
  <div id="ds-banner-host" class="ds-banner-host" hidden></div>
  {% block body %}{% endblock %}
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="{{ _('Рисунок') }}">
    <div class="lightbox__card" data-lb-card>
      <div class="lightbox__bar">
        <span class="lightbox__zoom" data-lb-level>100%</span>
        <div class="lightbox__tools" role="group" aria-label="{{ _('Масштаб') }}">
          <button class="icon-btn lightbox__btn" type="button" data-lb-out aria-label="{{ _('Уменьшить') }}" title="−">−</button>
          <button class="icon-btn lightbox__btn" type="button" data-lb-in aria-label="{{ _('Увеличить') }}" title="+">+</button>
          <button class="icon-btn lightbox__btn" type="button" data-lb-reset aria-label="{{ _('Сбросить масштаб') }}" title="1:1 (0)">1x</button>
          <button class="icon-btn lightbox__btn" type="button" data-lb-fit aria-label="{{ _('Во весь экран') }}" title="{{ _('Во весь экран') }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
          <button class="icon-btn lightbox__btn" type="button" data-lb-close aria-label="{{ _('Закрыть') }}" title="Esc">×</button>
        </div>
      </div>
      <div class="lightbox__stage" data-lb-stage>
        <img alt="" data-lb-img draggable="false">
      </div>
    </div>
  </div>
  <script defer src="{{ url_for('static', filename='vendor/katex/katex.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='vendor/katex/contrib/auto-render.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/date-picker.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/deploy-safety.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
