<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img">
<title>Integrals giving inverse trigonometric functions</title>
<desc>Integrals giving inverse trigonometric functions</desc>
<style>
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --soft-red: #FEE2E2;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
    --halo: #FFFFFF;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --soft-red: #3B1A24;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #64748B;
      --grid: #1E293B;
      --primary: #7AA2FF;
      --accent: #FB7185;
      --halo: #0F172A;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --soft-red: #3B1A24;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #64748B;
    --grid: #1E293B;
    --primary: #7AA2FF;
    --accent: #FB7185;
    --halo: #0F172A;
  }
  .bg { fill: var(--bg); }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .lbl { fill: var(--ink); font-size: 22px; font-weight: 700; }
  .tick { fill: var(--muted); font-size: 22px; font-weight: 600; }
  .ax { stroke: var(--axis); stroke-width: 1.8; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .prim { stroke: var(--primary); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .acc { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect class="bg" width="560" height="320"/>

  <rect x="18" y="24" width="524" height="122" rx="16" fill="var(--soft)" stroke="var(--primary)" stroke-width="2"/>
  <text x="42" y="96" font-size="22" font-weight="700" fill="var(--ink)">∫ dx /</text>
  <path d="M 108.0 88.2 L 112.0 88.2 L 117.0 100.0 L 124.0 72.0 L 194.0 72.0" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="halo" x="129.0" y="95.0" font-size="22" font-weight="700" fill="var(--ink)">a² − x²</text>
  <text x="210" y="96" font-size="22" font-weight="700" fill="var(--primary)">= arcsin(x/a) + C</text>
  <rect x="18" y="174" width="524" height="122" rx="16" fill="var(--soft)" stroke="var(--primary)" stroke-width="2"/>
  <text x="42" y="244" font-size="22" font-weight="700" fill="var(--ink)">∫ dx / (a² + x²) =</text>
  <text x="224" y="244" font-size="22" font-weight="700" fill="var(--primary)">(1/a) arctan(x/a) + C</text>

</svg>
