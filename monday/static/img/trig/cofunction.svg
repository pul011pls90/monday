<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img">
<title>Cofunction identities</title>
<desc>Cofunction identities</desc>
<style>
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --soft-red: #FEE2E2;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
    --halo: #FFFFFF;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --soft-red: #3B1A24;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #64748B;
      --grid: #1E293B;
      --primary: #7AA2FF;
      --accent: #FB7185;
      --halo: #0F172A;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --soft-red: #3B1A24;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #64748B;
    --grid: #1E293B;
    --primary: #7AA2FF;
    --accent: #FB7185;
    --halo: #0F172A;
  }
  .bg { fill: var(--bg); }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .lbl { fill: var(--ink); font-size: 22px; font-weight: 700; }
  .tick { fill: var(--muted); font-size: 22px; font-weight: 600; }
  .ax { stroke: var(--axis); stroke-width: 1.8; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .prim { stroke: var(--primary); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .acc { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect class="bg" width="520" height="320"/>

  <polygon points="105,250 415,250 415,58" fill="var(--soft)" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="395,250 395,230 415,230" fill="none" stroke="var(--primary)" stroke-width="2"/>
  <path d="M 162 250 A 57 57 0 0 0 153 220" fill="none" stroke="var(--accent)" stroke-width="2.2"/>
  <text class="halo" x="174" y="236" text-anchor="start" font-size="20" font-weight="700" fill="var(--primary)">θ</text>
  <text class="halo" x="405" y="132" text-anchor="end" font-size="20" font-weight="700" fill="var(--primary)">90° − θ</text>
  <text class="halo" x="260" y="290" text-anchor="middle" font-size="21" font-weight="700" fill="var(--ink)">cos θ = sin(90° − θ)</text>

</svg>
