<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img">
<title>Right-triangle definitions</title>
<desc>Right-triangle definitions</desc>
<style>
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --soft-red: #FEE2E2;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
    --halo: #FFFFFF;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --soft-red: #3B1A24;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #64748B;
      --grid: #1E293B;
      --primary: #7AA2FF;
      --accent: #FB7185;
      --halo: #0F172A;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --soft-red: #3B1A24;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #64748B;
    --grid: #1E293B;
    --primary: #7AA2FF;
    --accent: #FB7185;
    --halo: #0F172A;
  }
  .bg { fill: var(--bg); }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .lbl { fill: var(--ink); font-size: 22px; font-weight: 700; }
  .tick { fill: var(--muted); font-size: 22px; font-weight: 600; }
  .ax { stroke: var(--axis); stroke-width: 1.8; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .prim { stroke: var(--primary); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .acc { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect class="bg" width="520" height="320"/>

  <polygon points="80,260 360,260 360,70" fill="var(--soft)" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="338,260 338,238 360,238" fill="none" stroke="var(--primary)" stroke-width="2"/>
  <path d="M 135 260 A 55 55 0 0 0 125.5 229" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="halo" x="148" y="246" font-size="20" font-weight="700" fill="var(--accent)">θ</text>
  <text class="halo" x="220" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)">Adjacent (cos θ)</text>
  <text class="halo" x="374" y="172" font-size="20" font-weight="700" fill="var(--ink)">Opposite</text>
  <text class="halo" x="374" y="198" font-size="20" font-weight="700" fill="var(--primary)">(sin θ)</text>
  <text class="halo" x="195" y="148" text-anchor="end" font-size="20" font-weight="700" fill="var(--primary)">Hypotenuse = 1</text>

</svg>
