<rect x="115" y="90" width="490" height="270" rx="18" fill="#E8F1FB" fill-opacity="0.45" stroke="#2B60E5" stroke-width="2.2"/><line x1="115" y1="180" x2="605" y2="180" stroke="#8FA3BF" stroke-width="1.5"/><line x1="360" y1="90" x2="360" y2="360" stroke="#8FA3BF" stroke-width="1.5"/><text x="238" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#0E0E0E" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">sin θ ↔ csc θ = 1/sin θ</text><text x="482" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#0E0E0E" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">cos θ ↔ sec θ = 1/cos θ</text><text x="238" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#2B60E5" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">tan θ = sin θ / cos θ</text><text x="482" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#2B60E5" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">cot θ = cos θ / sin θ</text><text x="360" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#0E0E0E" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">tan θ · cot θ = 1</text></svg>
