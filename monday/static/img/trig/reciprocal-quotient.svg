<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img">
<title>Reciprocal and quotient identities</title>
<desc>Reciprocal and quotient identities</desc>
<style>
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --soft-red: #FEE2E2;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
    --halo: #FFFFFF;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --soft-red: #3B1A24;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #64748B;
      --grid: #1E293B;
      --primary: #7AA2FF;
      --accent: #FB7185;
      --halo: #0F172A;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --soft-red: #3B1A24;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #64748B;
    --grid: #1E293B;
    --primary: #7AA2FF;
    --accent: #FB7185;
    --halo: #0F172A;
  }
  .bg { fill: var(--bg); }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .lbl { fill: var(--ink); font-size: 22px; font-weight: 700; }
  .tick { fill: var(--muted); font-size: 22px; font-weight: 600; }
  .ax { stroke: var(--axis); stroke-width: 1.8; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .prim { stroke: var(--primary); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .acc { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect class="bg" width="520" height="340"/>

  <rect x="18" y="18" width="484" height="304" rx="18" fill="var(--soft)" stroke="var(--primary)" stroke-width="2"/>
  <line x1="18" y1="158" x2="502" y2="158" stroke="var(--axis)" stroke-width="1.5"/>
  <text x="260" y="64" text-anchor="middle" font-size="21" font-weight="700" fill="var(--ink)">sin θ ↔ csc θ = 1 / sin θ</text>
  <text x="260" y="114" text-anchor="middle" font-size="21" font-weight="700" fill="var(--ink)">cos θ ↔ sec θ = 1 / cos θ</text>
  <text x="260" y="204" text-anchor="middle" font-size="21" font-weight="700" fill="var(--primary)">tan θ = sin θ / cos θ</text>
  <text x="260" y="250" text-anchor="middle" font-size="21" font-weight="700" fill="var(--primary)">cot θ = cos θ / sin θ</text>
  <text x="260" y="296" text-anchor="middle" font-size="21" font-weight="700" fill="var(--ink)">tan θ · cot θ = 1</text>

</svg>
