<rect x="130" y="95" width="460" height="260" rx="18" fill="#E8F1FB" fill-opacity="0.45" stroke="#2B60E5" stroke-width="2.2"/><line x1="130" y1="180" x2="590" y2="180" stroke="#8FA3BF" stroke-width="1.5"/><line x1="360" y1="95" x2="360" y2="355" stroke="#8FA3BF" stroke-width="1.5"/><text x="245" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#0E0E0E">sin θ ↔ csc θ = 1/sin θ</text><text x="475" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#0E0E0E">cos θ ↔ sec θ = 1/cos θ</text><text x="245" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#2B60E5">tan θ = sin θ / cos θ</text><text x="475" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#2B60E5">cot θ = cos θ / sin θ</text><text x="360" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#0E0E0E">tan θ · cot θ = 1</text></svg>
