<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <title>Double-angle formulas</title>
  <desc>Double-angle formulas</desc>
  <style data-monday-theme="1">
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #7F8AA8;
      --grid: #252B3D;
      --primary: #7AA2FF;
      --accent: #FB7185;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #7F8AA8;
    --grid: #252B3D;
    --primary: #7AA2FF;
    --accent: #FB7185;
  }
  text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
  <rect width="720" height="450" fill="var(--bg)"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--axis)"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--primary)"/></marker>
  </defs>
<line x1="145" y1="230" x2="575" y2="230" stroke="var(--axis)" stroke-width="1.8" marker-end="url(#ax)"/><line x1="360" y1="405" x2="360" y2="55" stroke="var(--axis)" stroke-width="1.8" marker-end="url(#ax)"/><text x="571" y="252" font-family="Arial,sans-serif" font-size="28" font-style="italic" fill="var(--muted)">x</text><text x="372" y="69" font-family="Arial,sans-serif" font-size="28" font-style="italic" fill="var(--muted)">y</text>
  <circle cx="360" cy="230" r="135" fill="none" stroke="var(--primary)" stroke-width="2.5"/>
