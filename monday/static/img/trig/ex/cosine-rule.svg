<rect x="73.0" y="14" width="494" height="34" rx="10" fill="#E8F1FB" stroke="#2B60E5" stroke-opacity="0.3" stroke-width="1.2"/><text x="320" y="37" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#2B60E5">c² = 3² + 4² − 2·3·4·cos 60° = 13  ⇒  c = √13</text><polygon points="180,295 460,295 360,115" fill="#E8F1FB" stroke="#2B60E5" stroke-width="2.4"/><text x="320" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#0E0E0E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">b = 4</text><text x="425" y="200" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#0E0E0E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">a = 3</text><text x="256" y="200" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#2B60E5" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">c = √13</text><text x="422" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#2B60E5" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">60°</text></svg>
