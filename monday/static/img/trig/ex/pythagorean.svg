<rect x="83.0" y="14" width="474" height="34" rx="10" fill="#E8F1FB" stroke="#2B60E5" stroke-opacity="0.3" stroke-width="1.2"/><text x="320" y="37" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#2B60E5">cos²θ = 1 − (3/5)² = 16/25  ⇒  cos θ = −4/5</text>
