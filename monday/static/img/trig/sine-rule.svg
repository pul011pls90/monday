<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <title>Law of sines</title>
  <desc>Law of sines</desc>
  <style data-monday-theme="1">
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #7F8AA8;
      --grid: #252B3D;
      --primary: #7AA2FF;
      --accent: #FB7185;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #7F8AA8;
    --grid: #252B3D;
    --primary: #7AA2FF;
    --accent: #FB7185;
  }
  text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
  <rect width="720" height="450" fill="var(--bg)"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--axis)"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--primary)"/></marker>
  </defs>
<circle cx="360" cy="220" r="140" fill="none" stroke="var(--axis)" stroke-width="1.8" stroke-dasharray="6 4"/><polygon points="245,298 490,268 335,84" fill="var(--soft)" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round"/><text x="232" y="314" text-anchor="end" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="var(--ink)" paint-order="stroke" stroke="var(--bg)" stroke-width="6" stroke-linejoin="round">A</text><text x="504" y="278" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="var(--ink)" paint-order="stroke" stroke="var(--bg)" stroke-width="6" stroke-linejoin="round">B</text><text x="335" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="var(--ink)" paint-order="stroke" stroke="var(--bg)" stroke-width="6" stroke-linejoin="round">C</text><text x="360" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="var(--primary)" paint-order="stroke" stroke="var(--bg)" stroke-width="6" stroke-linejoin="round">a / sin A = b / sin B = c / sin C = 2R</text></svg>
