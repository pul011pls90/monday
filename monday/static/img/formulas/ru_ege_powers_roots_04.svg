<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img">
<title>Сравнение корней чётной и нечётной степени: y = x и y = |x|</title>
<desc>Координатная плоскость с графиками y = x (сплошная синяя прямая через (0; 0) с наклоном 1) и y = |x| (пунктирный красный график, совпадающий с y = x при x ≥ 0), с точками (−3; −3) и (−3; 3).</desc>
<style>
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --soft-red: #FEE2E2;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
    --halo: #FFFFFF;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --soft-red: #3B1A24;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #64748B;
      --grid: #1E293B;
      --primary: #7AA2FF;
      --accent: #FB7185;
      --halo: #0F172A;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --soft-red: #3B1A24;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #64748B;
    --grid: #1E293B;
    --primary: #7AA2FF;
    --accent: #FB7185;
    --halo: #0F172A;
  }
  .bg { fill: var(--bg); }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .lbl { fill: var(--ink); font-size: 18px; font-weight: 700; }
  .tick { fill: var(--muted); font-size: 18px; font-weight: 600; }
  .ax { stroke: var(--axis); stroke-width: 1.8; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .prim { stroke: var(--primary); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .acc { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--axis)"/></marker>
</defs>
<rect class="bg" width="560" height="380"/>
<line class="grid" x1="84.0" y1="30" x2="84.0" y2="350"/>
<line class="grid" x1="40" y1="321.0" x2="380" y2="321.0"/>
<line class="ax" x1="84.0" y1="191" x2="84.0" y2="199"/>
<text class="tick halo" x="84.0" y="217" text-anchor="middle">-3</text>
<line class="ax" x1="206" y1="321.0" x2="214" y2="321.0"/>
<text class="tick halo" x="200" y="327.0" text-anchor="end">-3</text>
<line class="grid" x1="126.0" y1="30" x2="126.0" y2="350"/>
<line class="grid" x1="40" y1="279.0" x2="380" y2="279.0"/>
