<text class="tick halo" x="200" y="285.0" text-anchor="end">-2</text>
<line class="grid" x1="168.0" y1="30" x2="168.0" y2="350"/>
<line class="grid" x1="40" y1="237.0" x2="380" y2="237.0"/>
<line class="ax" x1="168.0" y1="191" x2="168.0" y2="199"/>
<text class="tick halo" x="168.0" y="217" text-anchor="middle">-1</text>
<line class="ax" x1="206" y1="237.0" x2="214" y2="237.0"/>
<text class="tick halo" x="200" y="243.0" text-anchor="end">-1</text>
<line class="grid" x1="210.0" y1="30" x2="210.0" y2="350"/>
<line class="grid" x1="40" y1="195.0" x2="380" y2="195.0"/>
<line class="grid" x1="252.0" y1="30" x2="252.0" y2="350"/>
<line class="grid" x1="40" y1="153.0" x2="380" y2="153.0"/>
<line class="ax" x1="252.0" y1="191" x2="252.0" y2="199"/>
<text class="tick halo" x="252.0" y="217" text-anchor="middle">1</text>
<line class="ax" x1="206" y1="153.0" x2="214" y2="153.0"/>
<text class="tick halo" x="200" y="159.0" text-anchor="end">1</text>
<line class="grid" x1="294.0" y1="30" x2="294.0" y2="350"/>
<line class="grid" x1="40" y1="111.0" x2="380" y2="111.0"/>
<line class="ax" x1="294.0" y1="191" x2="294.0" y2="199"/>
<text class="tick halo" x="294.0" y="217" text-anchor="middle">2</text>
<line class="ax" x1="206" y1="111.0" x2="214" y2="111.0"/>
<text class="tick halo" x="200" y="117.0" text-anchor="end">2</text>
<line class="grid" x1="336.0" y1="30" x2="336.0" y2="350"/>
<line class="grid" x1="40" y1="69.0" x2="380" y2="69.0"/>
<line class="ax" x1="336.0" y1="191" x2="336.0" y2="199"/>
<text class="tick halo" x="336.0" y="217" text-anchor="middle">3</text>
<line class="ax" x1="206" y1="69.0" x2="214" y2="69.0"/>
<text class="tick halo" x="200" y="75.0" text-anchor="end">3</text>
<line class="ax" x1="40" y1="195" x2="382" y2="195" marker-end="url(#arr)"/>
<line class="ax" x1="210" y1="350" x2="210" y2="28" marker-end="url(#arr)"/>
<text class="lbl halo" x="390" y="201">x</text>
<text class="lbl halo" x="222" y="38">y</text>
<text class="tick halo" x="200" y="217" text-anchor="end">0</text>
<line class="prim" x1="67.2" y1="337.8" x2="352.8" y2="52.2"/>
<polyline class="acc" stroke-dasharray="8 6" points="67.2,52.2 210.0,195.0 352.8,52.2"/>
<line x1="84.0" y1="69.0" x2="84.0" y2="321.0" stroke="var(--axis)" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="84.0" cy="69.0" r="5.5" fill="var(--accent)"/>
<circle cx="84.0" cy="321.0" r="5.5" fill="var(--primary)"/>
<circle cx="210.0" cy="195.0" r="4.5" fill="var(--ink)"/>
<text class="lbl halo" x="74.0" y="59.0" text-anchor="end" fill="var(--accent)">(−3; 3)</text>
<text class="lbl halo" x="74.0" y="343.0" text-anchor="end" fill="var(--primary)">(−3; −3)</text>
<rect x="396" y="135" width="154" height="190" rx="14" fill="var(--soft)" stroke="var(--grid)" stroke-width="1.5"/>
<line class="prim" x1="408" y1="168" x2="432" y2="168"/>
<path d="M 444.0 165.9 L 448.0 165.9 L 453.0 176.0 L 460.0 152.0 L 496.0 152.0" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="451.0" y="162.1" text-anchor="end" font-size="18" font-weight="700" fill="var(--primary)">n</text>
  <text x="465.0" y="171.7" font-size="19" font-weight="700" fill="var(--primary)">xⁿ = x</text>
<text x="410" y="198" font-size="18" font-weight="600" fill="var(--muted)">n — нечётное</text>
<line class="acc" stroke-dasharray="6 5" x1="408" y1="238" x2="432" y2="238"/>
<path d="M 448.0 235.9 L 452.0 235.9 L 457.0 246.0 L 464.0 222.0 L 504.0 222.0" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="455.0" y="232.1" text-anchor="end" font-size="18" font-weight="700" fill="var(--accent)">2k</text>
  <text x="469.0" y="241.7" font-size="19" font-weight="700" fill="var(--accent)">x²ᵏ = |x|</text>
<text x="410" y="268" font-size="18" font-weight="600" fill="var(--muted)">2k — чётное</text>
<text x="410" y="302" font-size="18" font-weight="700" fill="var(--ink)">при x ≥ 0</text>
<text x="410" y="322" font-size="18" font-weight="600" fill="var(--muted)">совпадают</text>
</svg>