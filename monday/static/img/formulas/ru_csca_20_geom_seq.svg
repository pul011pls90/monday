<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <title>Геометрическая прогрессия</title>
  <desc>Геометрическая прогрессия</desc>
  <style data-monday-theme="1">
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #7F8AA8;
      --grid: #252B3D;
      --primary: #7AA2FF;
      --accent: #FB7185;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #7F8AA8;
    --grid: #252B3D;
    --primary: #7AA2FF;
    --accent: #FB7185;
  }
  text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
  <rect width="720" height="450" fill="var(--bg)"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--axis)"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--primary)"/></marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--ink)"/></marker>
    <marker id="arr-navy-s" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1.5L1 5L9 8.5z" fill="var(--ink)"/></marker>
    <marker id="arr-navy-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--ink)"/></marker>
  </defs>
  <line x1="105" y1="335" x2="615" y2="335" stroke="var(--axis)" stroke-width="2" stroke-linecap="round"/>
  <rect x="133" y="271" width="64" height="64" rx="8" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <text x="165" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">a₁</text>
  <rect x="243" y="242.2" width="64" height="92.8" rx="8" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <text x="275" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">a₁r</text>
  <rect x="353" y="200.4" width="64" height="134.6" rx="8" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <text x="385" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">a₁r²</text>
  <rect x="463" y="139.9" width="64" height="195.1" rx="8" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <text x="495" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">a₁r³</text>
  <text x="360" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">×r каждый шаг</text>
</svg>
