<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <title>Таблица производных</title>
  <desc>Таблица производных</desc>
  <style data-monday-theme="1">
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #7F8AA8;
      --grid: #252B3D;
      --primary: #7AA2FF;
      --accent: #FB7185;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #7F8AA8;
    --grid: #252B3D;
    --primary: #7AA2FF;
    --accent: #FB7185;
  }
  text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
  <rect width="720" height="450" fill="var(--bg)"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--axis)"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--primary)"/></marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--ink)"/></marker>
    <marker id="arr-navy-s" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1.5L1 5L9 8.5z" fill="var(--ink)"/></marker>
    <marker id="arr-navy-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--ink)"/></marker>
  </defs>
  <rect x="125" y="48" width="470" height="354" rx="16" fill="var(--bg)" stroke="var(--primary)" stroke-width="3"/>
  <rect x="125" y="48" width="470" height="59" rx="16" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <line x1="360" y1="48" x2="360" y2="402" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="107" x2="595" y2="107" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="166" x2="595" y2="166" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="225" x2="595" y2="225" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="284" x2="595" y2="284" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="343" x2="595" y2="343" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"/>
  <text x="242" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">f(x)</text>
  <text x="478" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">f′(x)</text>
  <text x="242" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">xⁿ</text>
  <text x="478" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">n·xⁿ⁻¹</text>
  <text x="242" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">eˣ</text>
  <text x="478" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">eˣ</text>
  <text x="242" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">ln x</text>
  <text x="478" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">1 / x</text>
  <text x="242" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">sin x</text>
  <text x="478" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">cos x</text>
  <text x="242" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">cos x</text>
  <text x="478" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">−sin x</text>
</svg>
