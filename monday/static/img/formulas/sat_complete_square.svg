<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <rect width="720" height="450" fill="#FFFFFF"/>
  <!-- x^2 square -->
  <rect x="190" y="85" width="180" height="180" fill="#EFF4FF" stroke="#2B60E5" stroke-width="3"/>
  <text x="280" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0A1A5C">x²</text>
  <!-- (b/2)x right -->
  <rect x="370" y="85" width="100" height="180" fill="#F8FAFC" stroke="#2B60E5" stroke-width="3"/>
  <text x="420" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2B60E5">(b/2)x</text>
  <!-- (b/2)x bottom -->
  <rect x="190" y="265" width="180" height="100" fill="#F8FAFC" stroke="#2B60E5" stroke-width="3"/>
  <text x="280" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2B60E5">(b/2)x</text>
  <!-- (b/2)^2 corner -->
  <rect x="370" y="265" width="100" height="100" fill="#DBEAFE" stroke="#0A1A5C" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="420" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A1A5C">(b/2)²</text>
  <!-- side labels -->
  <text x="280" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4B5E7A">x</text>
  <text x="420" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4B5E7A">b/2</text>
  <text x="168" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4B5E7A">x</text>
  <text x="162" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4B5E7A">b/2</text>
  <text x="330" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A1A5C">(x + b/2)² = x² + bx + (b/2)²</text>
</svg>
