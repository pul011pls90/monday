<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <title>Выделение полного квадрата</title>
  <desc>Выделение полного квадрата</desc>
  <style data-monday-theme="1">
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #7F8AA8;
      --grid: #252B3D;
      --primary: #7AA2FF;
      --accent: #FB7185;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #7F8AA8;
    --grid: #252B3D;
    --primary: #7AA2FF;
    --accent: #FB7185;
  }
  text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
  <rect width="720" height="450" fill="var(--bg)"/>
  <!-- x^2 square -->
  <rect x="190" y="85" width="180" height="180" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <text x="280" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">x²</text>
  <!-- (b/2)x right -->
  <rect x="370" y="85" width="100" height="180" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <text x="420" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--primary)">(b/2)x</text>
  <!-- (b/2)x bottom -->
  <rect x="190" y="265" width="180" height="100" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <text x="280" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--primary)">(b/2)x</text>
  <!-- (b/2)^2 corner -->
  <rect x="370" y="265" width="100" height="100" fill="#DBEAFE" stroke="var(--ink)" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="420" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">(b/2)²</text>
  <!-- side labels -->
  <text x="280" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--muted)">x</text>
  <text x="420" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--muted)">b/2</text>
  <text x="168" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--muted)">x</text>
  <text x="162" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--muted)">b/2</text>
  <text x="330" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">(x + b/2)² = x² + bx + (b/2)²</text>
</svg>
