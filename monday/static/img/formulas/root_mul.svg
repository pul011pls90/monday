<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img">
<title>Произведение квадратных корней</title>
<desc>Корень произведения равен произведению корней: √(a · b) = √a · √b при a, b ≥ 0.</desc>
<style>
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --soft-red: #FEE2E2;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
    --halo: #FFFFFF;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --soft-red: #3B1A24;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #64748B;
      --grid: #1E293B;
      --primary: #7AA2FF;
      --accent: #FB7185;
      --halo: #0F172A;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --soft-red: #3B1A24;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #64748B;
    --grid: #1E293B;
    --primary: #7AA2FF;
    --accent: #FB7185;
    --halo: #0F172A;
  }
  .bg { fill: var(--bg); }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .lbl { fill: var(--ink); font-size: 18px; font-weight: 700; }
  .tick { fill: var(--muted); font-size: 18px; font-weight: 600; }
  .ax { stroke: var(--axis); stroke-width: 1.8; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .prim { stroke: var(--primary); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .acc { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect class="bg" width="480" height="320"/>
<rect x="24" y="34" width="432" height="118" rx="16" fill="var(--soft)" stroke="var(--grid)" stroke-width="1.5"/>
<path d="M 60.0 90.2 L 64.0 90.2 L 69.0 102.0 L 76.0 74.0 L 130.0 74.0" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="81.0" y="97.0" font-size="24" font-weight="700" fill="var(--primary)">a · b</text>
<text x="150" y="98" font-size="24" font-weight="700" fill="var(--ink)">=</text>
<path d="M 176.0 90.2 L 180.0 90.2 L 185.0 102.0 L 192.0 74.0 L 218.0 74.0" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="197.0" y="97.0" font-size="24" font-weight="700" fill="var(--ink)">a</text>
<text x="228" y="98" font-size="24" font-weight="700" fill="var(--ink)">·</text>
<path d="M 246.0 90.2 L 250.0 90.2 L 255.0 102.0 L 262.0 74.0 L 288.0 74.0" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="267.0" y="97.0" font-size="24" font-weight="700" fill="var(--ink)">b</text>
<text x="240" y="198" text-anchor="middle" font-size="20" font-weight="700" fill="var(--muted)">Пример: a = 4, b = 9</text>
<path d="M 72.0 240.2 L 76.0 240.2 L 81.0 252.0 L 88.0 224.0 L 142.0 224.0" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="93.0" y="247.0" font-size="22" font-weight="700" fill="var(--primary)">4 · 9</text>
<text x="160" y="248" font-size="22" font-weight="700" fill="var(--ink)">= 2 · 3 = 6</text>
</svg>