  <line x1="330" y1="320" x2="540" y2="368" stroke="var(--axis)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="140" cy="225" r="6" fill="var(--ink)" stroke="none"/>
  <circle cx="330" cy="130" r="6" fill="var(--primary)" stroke="none"/>
  <circle cx="330" cy="320" r="6" fill="var(--axis)" stroke="none"/>
