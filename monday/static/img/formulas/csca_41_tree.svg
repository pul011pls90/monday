  <text x="225" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--primary)">P(A)</text>
  <text x="225" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--muted)">P(Aᶜ)</text>
  <text x="430" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">P(B|A)</text>
  <text x="598" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">P(AB)</text>
