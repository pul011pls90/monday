<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <title>От выборки ко всем</title>
  <desc>От выборки ко всем</desc>
  <style data-monday-theme="1">
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #7F8AA8;
      --grid: #252B3D;
      --primary: #7AA2FF;
      --accent: #FB7185;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #7F8AA8;
    --grid: #252B3D;
    --primary: #7AA2FF;
    --accent: #FB7185;
  }
  text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
  <rect width="720" height="450" fill="var(--bg)"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--primary)"/></marker>
  </defs>
  <circle cx="215" cy="225" r="130" fill="var(--soft)" stroke="var(--primary)" stroke-width="3.5"/>
  <text x="215" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">Population (N)</text>
  <circle cx="215" cy="245" r="56" fill="#DBEAFE" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="215" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">Sample (n)</text>
  <line x1="360" y1="225" x2="465" y2="225" stroke="var(--primary)" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="480" y="160" width="175" height="130" rx="18" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <text x="567" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">p̂ ≈ p</text>
  <text x="567" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="var(--muted)">p̂ ± margin</text>
</svg>
