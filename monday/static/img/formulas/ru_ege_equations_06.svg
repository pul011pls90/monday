<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <title>Иррациональное уравнение</title>
  <desc>Иррациональное уравнение</desc>
  <style data-monday-theme="1">
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #7F8AA8;
      --grid: #252B3D;
      --primary: #7AA2FF;
      --accent: #FB7185;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #7F8AA8;
    --grid: #252B3D;
    --primary: #7AA2FF;
    --accent: #FB7185;
  }
  text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
  <rect width="720" height="450" fill="var(--bg)"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--axis)"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--primary)"/></marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--ink)"/></marker>
    <marker id="arr-navy-s" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1.5L1 5L9 8.5z" fill="var(--ink)"/></marker>
    <marker id="arr-navy-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--ink)"/></marker>
  </defs>
  <rect x="110" y="95" width="500" height="80" rx="14" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <text x="360" y="129.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">√f(x) = g(x)</text>
  <text x="360" y="154.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="var(--muted)">исходное уравнение</text>
  <line x1="360" y1="180" x2="360" y2="232" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-navy)"/>
  <rect x="110" y="240" width="500" height="95" rx="14" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/>
  <text x="360" y="280.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">f(x) = g²(x)  и  g(x) ≥ 0</text>
  <text x="360" y="310.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="var(--muted)">возвести в квадрат + проверка!</text>
</svg>
