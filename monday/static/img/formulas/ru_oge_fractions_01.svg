<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <title>Действия с обыкновенными дробями</title>
  <desc>Действия с обыкновенными дробями</desc>
  <style data-monday-theme="1">
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #7F8AA8;
      --grid: #252B3D;
      --primary: #7AA2FF;
      --accent: #FB7185;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #7F8AA8;
    --grid: #252B3D;
    --primary: #7AA2FF;
    --accent: #FB7185;
  }
  text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
  <rect width="720" height="450" fill="var(--bg)"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--axis)"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--primary)"/></marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--ink)"/></marker>
    <marker id="arr-navy-s" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1.5L1 5L9 8.5z" fill="var(--ink)"/></marker>
    <marker id="arr-navy-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--ink)"/></marker>
  </defs>
  <text x="360" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">1/2 + 1/3 = 5/6</text>
  <rect x="120" y="95" width="480" height="44" rx="10" fill="var(--bg)" stroke="var(--axis)" stroke-width="2"/>
  <rect x="120" y="95" width="240" height="44" rx="6" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <text x="240" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--primary)">1/2</text>
  <rect x="360" y="95" width="159.8" height="44" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="3"/>
  <text x="439.9" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">1/3</text>
  <text x="360" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">2/3 · 3/4 = 1/2</text>
  <rect x="120" y="215" width="480" height="44" rx="10" fill="var(--bg)" stroke="var(--axis)" stroke-width="2"/>
  <rect x="120" y="215" width="240" height="44" rx="6" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <text x="240" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--primary)">2/3 × 3/4</text>
  <text x="360" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">1/2 ÷ 1/4 = 2</text>
  <rect x="120" y="335" width="480" height="44" rx="10" fill="var(--bg)" stroke="var(--axis)" stroke-width="2"/>
  <rect x="120" y="335" width="120" height="44" rx="6" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <text x="180" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--primary)">1/4</text>
  <rect x="240" y="335" width="120" height="44" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="3"/>
  <text x="300" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">1/4</text>
</svg>
