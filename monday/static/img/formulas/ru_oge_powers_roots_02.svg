<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" role="img">
<title>Квадратный корень из квадрата числа: √(a²) = |a|</title>
<desc>Тождество квадратного корня из квадрата с примерами для положительного и отрицательного числа.</desc>
<style>
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --soft-red: #FEE2E2;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
    --halo: #FFFFFF;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --soft-red: #3B1A24;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #64748B;
      --grid: #1E293B;
      --primary: #7AA2FF;
      --accent: #FB7185;
      --halo: #0F172A;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --soft-red: #3B1A24;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #64748B;
    --grid: #1E293B;
    --primary: #7AA2FF;
    --accent: #FB7185;
    --halo: #0F172A;
  }
  .bg { fill: var(--bg); }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .lbl { fill: var(--ink); font-size: 22px; font-weight: 700; }
  .tick { fill: var(--muted); font-size: 22px; font-weight: 600; }
  .ax { stroke: var(--axis); stroke-width: 1.8; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .prim { stroke: var(--primary); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .acc { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect class="bg" width="500" height="320"/>
<rect x="24" y="24" width="452" height="106" rx="16" fill="var(--soft)" stroke="var(--grid)" stroke-width="1.5"/>
<path d="M 120.0 71.4 L 124.0 71.4 L 129.0 84.0 L 136.0 54.0 L 172.0 54.0" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="halo" x="141.0" y="78.6" font-size="28" font-weight="700" fill="var(--primary)">a² = |a|</text>
<rect x="24" y="152" width="216" height="140" rx="14" fill="var(--soft)" stroke="var(--grid)" stroke-width="1.5"/>
<text x="132" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="var(--primary)">a = 3 ≥ 0</text>
<path d="M 56.0 234.2 L 60.0 234.2 L 65.0 246.0 L 72.0 218.0 L 108.0 218.0" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="halo" x="77.0" y="241.0" font-size="22" font-weight="700" fill="var(--ink)">3² = 3</text>
<rect x="260" y="152" width="216" height="140" rx="14" fill="var(--soft-red)" stroke="var(--grid)" stroke-width="1.5"/>
<text x="368" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="var(--accent)">a = −3 &lt; 0</text>
<path d="M 274.0 234.2 L 278.0 234.2 L 283.0 246.0 L 290.0 218.0 L 358.0 218.0" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="halo" x="295.0" y="241.0" font-size="20" font-weight="700" fill="var(--ink)">(−3)² = |−3| = 3</text>
</svg>