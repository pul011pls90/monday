  <circle cx="250" cy="225" r="130" fill="var(--bg)" stroke="var(--axis)" stroke-width="2"/>
  <path d="M 380 225 L 315 337.6 L 185 337.6 L 120 225 L 185 112.4 L 315 112.4 Z" fill="var(--soft)" stroke="var(--primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
