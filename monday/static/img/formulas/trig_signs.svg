<text x="34" y="212" font-size="22" font-weight="700" fill="var(--ink)">tan θ</text>
<circle cx="164" cy="251" r="44" fill="var(--soft)" stroke="var(--primary)" stroke-width="2.2"/>
<line x1="108" y1="251" x2="220" y2="251" stroke="var(--axis)" stroke-width="1.5"/>
<line x1="164" y1="307" x2="164" y2="195" stroke="var(--axis)" stroke-width="1.5"/>
<text class="halo" x="184" y="239" text-anchor="middle" font-size="22" font-weight="700" fill="var(--primary)">+</text>
<text class="halo" x="144" y="239" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">−</text>
<text class="halo" x="144" y="276" text-anchor="middle" font-size="22" font-weight="700" fill="var(--primary)">+</text>
<text class="halo" x="184" y="276" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">−</text>
<rect x="268" y="178" width="236" height="146" rx="14" fill="var(--bg)" stroke="var(--grid)" stroke-width="1.8"/>
<text x="286" y="212" font-size="22" font-weight="700" fill="var(--ink)">cot θ</text>
<circle cx="416" cy="251" r="44" fill="var(--soft)" stroke="var(--primary)" stroke-width="2.2"/>
<line x1="360" y1="251" x2="472" y2="251" stroke="var(--axis)" stroke-width="1.5"/>
<line x1="416" y1="307" x2="416" y2="195" stroke="var(--axis)" stroke-width="1.5"/>
<text class="halo" x="436" y="239" text-anchor="middle" font-size="22" font-weight="700" fill="var(--primary)">+</text>
<text class="halo" x="396" y="239" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">−</text>
<text class="halo" x="396" y="276" text-anchor="middle" font-size="22" font-weight="700" fill="var(--primary)">+</text>
<text class="halo" x="436" y="276" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">−</text>
</svg>