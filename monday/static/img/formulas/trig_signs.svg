<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img">
<title>Знаки sin, cos, tan, cot по четвертям</title>
<desc>Четыре координатные четверти со знаками + и − для sin θ, cos θ, tan θ и cot θ.</desc>
<style>
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --soft-red: #FEE2E2;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
    --halo: #FFFFFF;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --soft-red: #3B1A24;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #64748B;
      --grid: #1E293B;
      --primary: #7AA2FF;
      --accent: #FB7185;
      --halo: #0F172A;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --soft-red: #3B1A24;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #64748B;
    --grid: #1E293B;
    --primary: #7AA2FF;
    --accent: #FB7185;
    --halo: #0F172A;
  }
  .bg { fill: var(--bg); }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .lbl { fill: var(--ink); font-size: 22px; font-weight: 700; }
  .tick { fill: var(--muted); font-size: 22px; font-weight: 600; }
  .ax { stroke: var(--axis); stroke-width: 1.8; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .prim { stroke: var(--primary); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .acc { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect class="bg" width="520" height="340"/>
<rect x="16" y="16" width="236" height="146" rx="14" fill="var(--bg)" stroke="var(--grid)" stroke-width="1.8"/>
<text x="34" y="50" font-size="22" font-weight="700" fill="var(--ink)">sin θ</text>
<circle cx="164" cy="89" r="44" fill="var(--soft)" stroke="var(--primary)" stroke-width="2.2"/>
<line x1="108" y1="89" x2="220" y2="89" stroke="var(--axis)" stroke-width="1.5"/>
<line x1="164" y1="145" x2="164" y2="33" stroke="var(--axis)" stroke-width="1.5"/>
<text class="halo" x="184" y="77" text-anchor="middle" font-size="22" font-weight="700" fill="var(--primary)">+</text>
<text class="halo" x="144" y="77" text-anchor="middle" font-size="22" font-weight="700" fill="var(--primary)">+</text>
<text class="halo" x="144" y="114" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">−</text>
<text class="halo" x="184" y="114" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">−</text>
