<text x="286" y="50" font-size="22" font-weight="700" fill="var(--ink)">cos θ</text>
<circle cx="416" cy="89" r="44" fill="var(--soft)" stroke="var(--primary)" stroke-width="2.2"/>
<line x1="360" y1="89" x2="472" y2="89" stroke="var(--axis)" stroke-width="1.5"/>
<line x1="416" y1="145" x2="416" y2="33" stroke="var(--axis)" stroke-width="1.5"/>
<text class="halo" x="436" y="77" text-anchor="middle" font-size="22" font-weight="700" fill="var(--primary)">+</text>
<text class="halo" x="396" y="77" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">−</text>
<text class="halo" x="396" y="114" text-anchor="middle" font-size="22" font-weight="700" fill="var(--accent)">−</text>
<text class="halo" x="436" y="114" text-anchor="middle" font-size="22" font-weight="700" fill="var(--primary)">+</text>
