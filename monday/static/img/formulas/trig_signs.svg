<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 184" fill="none">
  <title>Знаки тригонометрических функций в четвертях</title>
  <desc>Знаки тригонометрических функций в четвертях</desc>
  <style data-monday-theme="1">
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #7F8AA8;
      --grid: #252B3D;
      --primary: #7AA2FF;
      --accent: #FB7185;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #7F8AA8;
    --grid: #252B3D;
    --primary: #7AA2FF;
    --accent: #FB7185;
  }
  text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
  <!-- Panel 1: sin α (I: +, II: +, III: −, IV: −) -->
  <g transform="translate(6, 6)">
    <rect width="158" height="172" rx="14" fill="var(--bg)" stroke="var(--grid)" stroke-width="1.5"/>
    <text x="79" y="24" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="#000E29">sin <tspan font-style="italic" font-family="Georgia, serif" font-weight="700">α</tspan></text>
    <!-- Upper half positive (var(--soft)), lower half negative (var(--soft)) -->
    <path d="M 31 102 A 48 48 0 0 1 127 102 Z" fill="var(--soft)"/>
    <path d="M 127 102 A 48 48 0 0 1 31 102 Z" fill="var(--soft)"/>
    <circle cx="79" cy="102" r="48" stroke="var(--primary)" stroke-width="2"/>
    <!-- Axes -->
    <line x1="21" y1="102" x2="139" y2="102" stroke="var(--primary)" stroke-width="1.5"/>
    <path d="M 135 98.5 L 141 102 L 135 105.5" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="79" y1="158" x2="79" y2="44" stroke="var(--primary)" stroke-width="1.5"/>
    <path d="M 75.5 48 L 79 42 L 82.5 48" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="145" y="106" font-family="Georgia, serif" font-size="26" font-style="italic" fill="var(--muted)">x</text>
    <text x="86" y="47" font-family="Georgia, serif" font-size="26" font-style="italic" fill="var(--muted)">y</text>
    <!-- Quadrant Roman numerals -->
    <text x="124" y="61" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">I</text>
    <text x="33" y="61" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">II</text>
    <text x="31" y="151" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">III</text>
    <text x="126" y="151" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">IV</text>
    <!-- Signs -->
    <text x="98" y="88" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--primary)">+</text>
    <text x="60" y="88" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--primary)">+</text>
    <text x="60" y="126" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--accent)">−</text>
    <text x="98" y="126" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--accent)">−</text>
  </g>

  <!-- Panel 2: cos α (I: +, II: −, III: −, IV: +) -->
  <g transform="translate(176, 6)">
    <rect width="158" height="172" rx="14" fill="var(--bg)" stroke="var(--grid)" stroke-width="1.5"/>
    <text x="79" y="24" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="#000E29">cos <tspan font-style="italic" font-family="Georgia, serif" font-weight="700">α</tspan></text>
    <!-- Right half positive (var(--soft)), left half negative (var(--soft)) -->
    <path d="M 79 54 A 48 48 0 0 1 79 150 Z" fill="var(--soft)"/>
    <path d="M 79 150 A 48 48 0 0 1 79 54 Z" fill="var(--soft)"/>
    <circle cx="79" cy="102" r="48" stroke="var(--primary)" stroke-width="2"/>
    <!-- Axes -->
    <line x1="21" y1="102" x2="139" y2="102" stroke="var(--primary)" stroke-width="1.5"/>
    <path d="M 135 98.5 L 141 102 L 135 105.5" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="79" y1="158" x2="79" y2="44" stroke="var(--primary)" stroke-width="1.5"/>
    <path d="M 75.5 48 L 79 42 L 82.5 48" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="145" y="106" font-family="Georgia, serif" font-size="26" font-style="italic" fill="var(--muted)">x</text>
    <text x="86" y="47" font-family="Georgia, serif" font-size="26" font-style="italic" fill="var(--muted)">y</text>
    <!-- Quadrant Roman numerals -->
    <text x="124" y="61" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">I</text>
    <text x="33" y="61" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">II</text>
    <text x="31" y="151" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">III</text>
    <text x="126" y="151" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">IV</text>
    <!-- Signs -->
    <text x="98" y="88" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--primary)">+</text>
    <text x="60" y="88" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--accent)">−</text>
    <text x="60" y="126" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--accent)">−</text>
    <text x="98" y="126" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--primary)">+</text>
  </g>

  <!-- Panel 3: tg α (I: +, II: −, III: +, IV: −) -->
  <g transform="translate(346, 6)">
    <rect width="158" height="172" rx="14" fill="var(--bg)" stroke="var(--grid)" stroke-width="1.5"/>
    <text x="79" y="24" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="#000E29">tg <tspan font-style="italic" font-family="Georgia, serif" font-weight="700">α</tspan></text>
    <!-- Quadrants I & III positive (var(--soft)), II & IV negative (var(--soft)) -->
    <path d="M 79 102 L 79 54 A 48 48 0 0 1 127 102 Z" fill="var(--soft)"/>
    <path d="M 79 102 L 31 102 A 48 48 0 0 1 79 54 Z" fill="var(--soft)"/>
    <path d="M 79 102 L 79 150 A 48 48 0 0 1 31 102 Z" fill="var(--soft)"/>
    <path d="M 79 102 L 127 102 A 48 48 0 0 1 79 150 Z" fill="var(--soft)"/>
    <circle cx="79" cy="102" r="48" stroke="var(--primary)" stroke-width="2"/>
    <!-- Axes -->
    <line x1="21" y1="102" x2="139" y2="102" stroke="var(--primary)" stroke-width="1.5"/>
    <path d="M 135 98.5 L 141 102 L 135 105.5" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="79" y1="158" x2="79" y2="44" stroke="var(--primary)" stroke-width="1.5"/>
    <path d="M 75.5 48 L 79 42 L 82.5 48" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="145" y="106" font-family="Georgia, serif" font-size="26" font-style="italic" fill="var(--muted)">x</text>
    <text x="86" y="47" font-family="Georgia, serif" font-size="26" font-style="italic" fill="var(--muted)">y</text>
    <!-- Quadrant Roman numerals -->
    <text x="124" y="61" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">I</text>
    <text x="33" y="61" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">II</text>
    <text x="31" y="151" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">III</text>
    <text x="126" y="151" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">IV</text>
    <!-- Signs -->
    <text x="98" y="88" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--primary)">+</text>
    <text x="60" y="88" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--accent)">−</text>
    <text x="60" y="126" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--primary)">+</text>
    <text x="98" y="126" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--accent)">−</text>
  </g>

  <!-- Panel 4: ctg α (I: +, II: −, III: +, IV: −) -->
  <g transform="translate(516, 6)">
    <rect width="158" height="172" rx="14" fill="var(--bg)" stroke="var(--grid)" stroke-width="1.5"/>
    <text x="79" y="24" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="#000E29">ctg <tspan font-style="italic" font-family="Georgia, serif" font-weight="700">α</tspan></text>
    <!-- Quadrants I & III positive (var(--soft)), II & IV negative (var(--soft)) -->
    <path d="M 79 102 L 79 54 A 48 48 0 0 1 127 102 Z" fill="var(--soft)"/>
    <path d="M 79 102 L 31 102 A 48 48 0 0 1 79 54 Z" fill="var(--soft)"/>
    <path d="M 79 102 L 79 150 A 48 48 0 0 1 31 102 Z" fill="var(--soft)"/>
    <path d="M 79 102 L 127 102 A 48 48 0 0 1 79 150 Z" fill="var(--soft)"/>
    <circle cx="79" cy="102" r="48" stroke="var(--primary)" stroke-width="2"/>
    <!-- Axes -->
    <line x1="21" y1="102" x2="139" y2="102" stroke="var(--primary)" stroke-width="1.5"/>
    <path d="M 135 98.5 L 141 102 L 135 105.5" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="79" y1="158" x2="79" y2="44" stroke="var(--primary)" stroke-width="1.5"/>
    <path d="M 75.5 48 L 79 42 L 82.5 48" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="145" y="106" font-family="Georgia, serif" font-size="26" font-style="italic" fill="var(--muted)">x</text>
    <text x="86" y="47" font-family="Georgia, serif" font-size="26" font-style="italic" fill="var(--muted)">y</text>
    <!-- Quadrant Roman numerals -->
    <text x="124" y="61" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">I</text>
    <text x="33" y="61" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">II</text>
    <text x="31" y="151" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">III</text>
    <text x="126" y="151" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="700" fill="var(--muted)">IV</text>
    <!-- Signs -->
    <text x="98" y="88" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--primary)">+</text>
    <text x="60" y="88" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--accent)">−</text>
    <text x="60" y="126" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--primary)">+</text>
    <text x="98" y="126" text-anchor="middle" font-family="Onest, Arial, sans-serif" font-size="26" font-weight="800" fill="var(--accent)">−</text>
  </g>
</svg>
