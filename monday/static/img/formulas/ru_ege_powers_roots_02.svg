<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img">
<title>Свойства корней n-й степени: нечётный и чётный показатели</title>
<desc>Сравнение корня нечётной степени (результат x) и чётной степени (результат |x|) с числовыми примерами при x = −3.</desc>
<style>
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --soft-red: #FEE2E2;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
    --halo: #FFFFFF;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --soft-red: #3B1A24;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #64748B;
      --grid: #1E293B;
      --primary: #7AA2FF;
      --accent: #FB7185;
      --halo: #0F172A;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --soft-red: #3B1A24;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #64748B;
    --grid: #1E293B;
    --primary: #7AA2FF;
    --accent: #FB7185;
    --halo: #0F172A;
  }
  .bg { fill: var(--bg); }
  .halo { paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  .lbl { fill: var(--ink); font-size: 18px; font-weight: 700; }
  .tick { fill: var(--muted); font-size: 18px; font-weight: 600; }
  .ax { stroke: var(--axis); stroke-width: 1.8; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .prim { stroke: var(--primary); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .acc { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
<rect class="bg" width="520" height="320"/>
<rect x="20" y="24" width="480" height="122" rx="16" fill="var(--soft)" stroke="var(--grid)" stroke-width="1.5"/>
<path d="M 48.0 64.2 L 52.0 64.2 L 57.0 76.0 L 64.0 48.0 L 102.0 48.0" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="halo" x="55.0" y="59.8" text-anchor="end" font-size="22" font-weight="700" fill="var(--primary)">n</text>
  <text class="halo" x="69.0" y="71.0" font-size="24" font-weight="700" fill="var(--primary)">aⁿ = a</text>
<text x="200" y="72" font-size="20" font-weight="700" fill="var(--muted)">(n — нечётное)</text>
<path d="M 48.0 113.1 L 52.0 113.1 L 57.0 124.0 L 64.0 98.0 L 128.0 98.0" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="halo" x="55.0" y="108.9" text-anchor="end" font-size="18" font-weight="700" fill="var(--ink)">3</text>
  <text class="halo" x="69.0" y="119.3" font-size="20" font-weight="700" fill="var(--ink)">(−3)³ = −3</text>
<rect x="20" y="168" width="480" height="128" rx="16" fill="var(--soft-red)" stroke="var(--grid)" stroke-width="1.5"/>
<path d="M 56.0 208.2 L 60.0 208.2 L 65.0 220.0 L 72.0 192.0 L 120.0 192.0" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="halo" x="63.0" y="203.8" text-anchor="end" font-size="22" font-weight="700" fill="var(--accent)">2k</text>
  <text class="halo" x="77.0" y="215.0" font-size="24" font-weight="700" fill="var(--accent)">a²ᵏ = |a|</text>
<text x="230" y="216" font-size="20" font-weight="700" fill="var(--muted)">(2k — чётное)</text>
<path d="M 56.0 257.1 L 60.0 257.1 L 65.0 268.0 L 72.0 242.0 L 136.0 242.0" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="halo" x="63.0" y="252.9" text-anchor="end" font-size="18" font-weight="700" fill="var(--ink)">2</text>
  <text class="halo" x="77.0" y="263.3" font-size="20" font-weight="700" fill="var(--ink)">(−3)² = |−3| = 3</text>
</svg>