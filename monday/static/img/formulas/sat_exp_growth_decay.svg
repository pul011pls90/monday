  <text x="112" y="295" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2B60E5">(0, a)</text>
  <text x="112" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0A1A5C">(0, a)</text>
  <text x="485" y="74" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2B60E5">y = a(1 + r)ᵗ</text>
  <text x="455" y="348" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A1A5C">y = a(1 − r)ᵗ</text>
