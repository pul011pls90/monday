  .main { stroke: var(--primary); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .aux { stroke: var(--axis); stroke-width: 1.25; stroke-dasharray: 4 3; fill: none; }
  .soft { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 1.5; stroke-linejoin: round; }
  .pt { fill: var(--primary); stroke: var(--bg); stroke-width: 1.5; }
  .hole { fill: var(--bg); stroke: var(--primary); stroke-width: 2; }


</style>
