<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <title>Число решений системы</title>
  <desc>Число решений системы</desc>
  <style data-monday-theme="1">
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #7F8AA8;
      --grid: #252B3D;
      --primary: #7AA2FF;
      --accent: #FB7185;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #7F8AA8;
    --grid: #252B3D;
    --primary: #7AA2FF;
    --accent: #FB7185;
  }
  text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
  <rect width="720" height="450" fill="var(--bg)"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--axis)"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--primary)"/></marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--ink)"/></marker>
    <marker id="arr-navy-s" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1.5L1 5L9 8.5z" fill="var(--ink)"/></marker>
    <marker id="arr-navy-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--ink)"/></marker>
  </defs>
  <rect x="83" y="85" width="164" height="210" rx="16" fill="var(--bg)" stroke="var(--axis)" stroke-width="2"/>
  <line x1="95" y1="235" x2="235" y2="115" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/>
  <line x1="95" y1="125" x2="235" y2="225" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="165" cy="175" r="6.5" fill="var(--ink)" stroke="var(--ink)" stroke-width="3"/>
  <text x="165" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">1 решение</text>
  <rect x="278" y="85" width="164" height="210" rx="16" fill="var(--bg)" stroke="var(--axis)" stroke-width="2"/>
  <line x1="290" y1="225" x2="430" y2="125" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/>
  <line x1="290" y1="260" x2="430" y2="160" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <text x="360" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">0 решений</text>
  <rect x="473" y="85" width="164" height="210" rx="16" fill="var(--bg)" stroke="var(--axis)" stroke-width="2"/>
  <line x1="485" y1="235" x2="625" y2="125" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/>
  <line x1="485" y1="235" x2="625" y2="125" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="555" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">∞ решений</text>
