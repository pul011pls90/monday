<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <title>Неравенства с модулем</title>
  <desc>Неравенства с модулем</desc>
  <style data-monday-theme="1">
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #7F8AA8;
      --grid: #252B3D;
      --primary: #7AA2FF;
      --accent: #FB7185;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #7F8AA8;
    --grid: #252B3D;
    --primary: #7AA2FF;
    --accent: #FB7185;
  }
  text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
  <rect width="720" height="450" fill="var(--bg)"/>
