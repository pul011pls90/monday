<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <rect width="720" height="450" fill="#FFFFFF"/>
  <!-- Prism (left) -->
  <polygon points="110,335 270,335 220,275" fill="#DBEAFE" stroke="#2B60E5" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="110,135 270,135 220,75" fill="#EFF4FF" stroke="#2B60E5" stroke-width="3" stroke-linejoin="round"/>
  <line x1="110" y1="135" x2="110" y2="335" stroke="#2B60E5" stroke-width="3"/>
  <line x1="270" y1="135" x2="270" y2="335" stroke="#2B60E5" stroke-width="3"/>
  <line x1="220" y1="75" x2="220" y2="275" stroke="#2B60E5" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="190" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0A1A5C">Sосн</text>
  <text x="90" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A1A5C" font-style="italic">h</text>
  <text x="190" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0E0E0E">Призма</text>
  <text x="190" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2B60E5">V = Sосн · h</text>

  <!-- Cylinder (right) -->
  <ellipse cx="520" cy="335" rx="95" ry="26" fill="#DBEAFE" stroke="#2B60E5" stroke-width="2.5"/>
  <line x1="425" y1="125" x2="425" y2="335" stroke="#2B60E5" stroke-width="3"/>
  <line x1="615" y1="125" x2="615" y2="335" stroke="#2B60E5" stroke-width="3"/>
  <ellipse cx="520" cy="125" rx="95" ry="26" fill="#EFF4FF" stroke="#2B60E5" stroke-width="3"/>
  <line x1="520" y1="125" x2="520" y2="335" stroke="#0A1A5C" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="520" y1="335" x2="615" y2="335" stroke="#0A1A5C" stroke-width="2.5"/>
  <text x="568" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0A1A5C" font-style="italic">r</text>
  <text x="506" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A1A5C" font-style="italic">h</text>
  <text x="520" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0E0E0E">Цилиндр</text>
  <text x="520" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2B60E5">V = πr²h · Sбок = 2πrh</text>
</svg>
