  <text x="280" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">a₂</text>
  <path d="M286 250 Q345.0 184 402 246" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <text x="345" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">+d</text>
