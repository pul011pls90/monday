  <text x="410" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">a₃</text>
  <path d="M416 250 Q475.0 184 532 246" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <text x="475" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">+d</text>
