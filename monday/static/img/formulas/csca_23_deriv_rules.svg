<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <title>Правила дифференцирования</title>
  <desc>Правила дифференцирования</desc>
  <style data-monday-theme="1">
  svg {
    --bg: #FFFFFF;
    --soft: #EEF2FF;
    --ink: #0B0B0C;
    --muted: #4E5775;
    --axis: #8A93B2;
    --grid: #E3E8FA;
    --primary: #2F4FE0;
    --accent: #E5484D;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) svg {
      --bg: #0F172A;
      --soft: #1E293B;
      --ink: #F1F5F9;
      --muted: #CBD5E1;
      --axis: #7F8AA8;
      --grid: #252B3D;
      --primary: #7AA2FF;
      --accent: #FB7185;
    }
  }
  :root[data-theme="dark"] svg {
    --bg: #0F172A;
    --soft: #1E293B;
    --ink: #F1F5F9;
    --muted: #CBD5E1;
    --axis: #7F8AA8;
    --grid: #252B3D;
    --primary: #7AA2FF;
    --accent: #FB7185;
  }
  text { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
  <rect width="720" height="450" fill="var(--bg)"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--axis)"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--primary)"/></marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--ink)"/></marker>
    <marker id="arr-navy-s" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1.5L1 5L9 8.5z" fill="var(--ink)"/></marker>
    <marker id="arr-navy-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="var(--ink)"/></marker>
  </defs>
  <rect x="96" y="66" width="165" height="86" rx="14" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <rect x="295" y="66" width="329" height="86" rx="14" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/>
  <line x1="261" y1="109" x2="295" y2="109" stroke="var(--axis)" stroke-width="2" stroke-linecap="round" marker-end="url(#ax)"/>
  <text x="178" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">(u·v)′</text>
  <text x="460" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">u′v + uv′</text>
  <rect x="96" y="182" width="165" height="86" rx="14" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <rect x="295" y="182" width="329" height="86" rx="14" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/>
  <line x1="261" y1="225" x2="295" y2="225" stroke="var(--axis)" stroke-width="2" stroke-linecap="round" marker-end="url(#ax)"/>
  <text x="178" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">(u/v)′</text>
  <text x="460" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">(u′v − uv′) / v²</text>
  <rect x="96" y="298" width="165" height="86" rx="14" fill="var(--soft)" stroke="var(--primary)" stroke-width="3"/>
  <rect x="295" y="298" width="329" height="86" rx="14" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/>
  <line x1="261" y1="341" x2="295" y2="341" stroke="var(--axis)" stroke-width="2" stroke-linecap="round" marker-end="url(#ax)"/>
  <text x="178" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">[f(g)]′</text>
  <text x="460" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="var(--ink)">f′(g) · g′</text>
</svg>
