  <rect x="90" y="85" width="255" height="120" rx="14" fill="#E8F1FB" stroke="#2B60E5" stroke-width="3"/>
  <text x="217.5" y="136.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A1A5C">√(a·b) = √a · √b</text>
  <text x="217.5" y="173.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#4B5E7A">√(4·9) = 2·3 = 6</text>
  <rect x="375" y="85" width="255" height="120" rx="14" fill="#E8F1FB" stroke="#2B60E5" stroke-width="3"/>
  <text x="502.5" y="136.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A1A5C">√(a/b) = √a / √b</text>
  <text x="502.5" y="173.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#4B5E7A">√(9/16) = 3/4</text>
  <rect x="90" y="240" width="255" height="120" rx="14" fill="#E8F1FB" stroke="#2B60E5" stroke-width="3"/>
  <text x="217.5" y="291.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A1A5C">(√a)² = a</text>
  <text x="217.5" y="328.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#4B5E7A">(√5)² = 5</text>
