<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <rect width="720" height="450" fill="#FFFFFF"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="#8FA3BF"/></marker>
  </defs>
  <!-- Axes centered at (360, 250) -->
  <line x1="80" y1="250" x2="640" y2="250" stroke="#8FA3BF" stroke-width="2" stroke-linecap="round" marker-end="url(#ax)"/>
  <line x1="360" y1="400" x2="360" y2="55" stroke="#8FA3BF" stroke-width="2" stroke-linecap="round" marker-end="url(#ax)"/>
  <text x="648" y="255" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4B5E7A" font-style="italic">a</text>
  <text x="374" y="65" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4B5E7A" font-style="italic">y</text>
  <text x="346" y="268" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#8FA3BF">0</text>

  <!-- Even root: y = |a| (V-shape, solid navy) -->
  <polyline points="170,60 360,250 550,60" fill="none" stroke="#0A1A5C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/>

  <!-- Odd root: y = a (diagonal line, solid blue) -->
  <line x1="170" y1="410" x2="550" y2="60" stroke="#2B60E5" stroke-width="4" stroke-linecap="round"/>

  <!-- Sample points at a = -2 (x=220) and a = 2 (x=500) -->
  <line x1="220" y1="250" x2="220" y2="110" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="220" y1="250" x2="220" y2="364" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="220" cy="110" r="6" fill="#0A1A5C"/>
  <circle cx="220" cy="364" r="6" fill="#2B60E5"/>
  <text x="206" y="100" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0A1A5C">(−a, |a|)</text>
  <text x="206" y="370" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2B60E5">(−a, −a)</text>

  <!-- Legend pills -->
  <rect x="400" y="290" width="235" height="44" rx="12" fill="#EFF4FF" stroke="#C7D7FE" stroke-width="1.5"/>
  <line x1="416" y1="312" x2="444" y2="312" stroke="#2B60E5" stroke-width="4" stroke-linecap="round"/>
  <text x="456" y="318" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B60E5">ⁿ√(aⁿ) = a (n неч.)</text>

  <rect x="400" y="346" width="235" height="44" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="416" y1="368" x2="444" y2="368" stroke="#0A1A5C" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 5"/>
  <text x="456" y="374" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0A1A5C">²ᵏ√(a²ᵏ) = |a|</text>
</svg>
