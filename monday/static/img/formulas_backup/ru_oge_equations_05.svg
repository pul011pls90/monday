<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450">
  <rect width="720" height="450" fill="#FFFFFF"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="#8FA3BF"/></marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="#2B60E5"/></marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="#0A1A5C"/></marker>
    <marker id="arr-navy-s" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9 1.5L1 5L9 8.5z" fill="#0A1A5C"/></marker>
    <marker id="arr-navy-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="#0A1A5C"/></marker>
  </defs>
  <rect x="105" y="85" width="510" height="82" rx="14" fill="#E8F1FB" stroke="#2B60E5" stroke-width="3"/>
  <text x="360" y="120.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A1A5C">ax⁴ + bx² + c = 0</text>
  <text x="360" y="145.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#4B5E7A">степень 4</text>
  <line x1="360" y1="172" x2="360" y2="232" stroke="#0A1A5C" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-navy)"/>
  <text x="460" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A1A5C">t = x² ≥ 0</text>
  <rect x="105" y="240" width="510" height="82" rx="14" fill="#FFFFFF" stroke="#0A1A5C" stroke-width="3"/>
  <text x="360" y="275.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0A1A5C">at² + bt + c = 0</text>
  <text x="360" y="300.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#4B5E7A">квадратное уравнение</text>
  <text x="360" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2B60E5">x = ±√t  (только при t ≥ 0)</text>
</svg>
