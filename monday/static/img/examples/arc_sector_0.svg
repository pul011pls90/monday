<text x="197.0" y="220.0" text-anchor="start" class="lbl f-angle">θ = pi/3</text>
<text x="303.0" y="161.2" text-anchor="start" class="lbl f-arc">s = rθ</text>
<text x="213.8" y="196.2" text-anchor="middle" class="lbl f-sector">A = ½r²θ</text>
</svg>
