<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Окружность с углами 30° и 90°.">
<style>
  svg { --ink: #0B0B0C; --axis: #8A93B2; --grid: #E3E8FA; --primary: #2F4FE0; --primary-soft: #E3E8FA; --answer: #E5484D; --answer-soft: rgba(229,72,77,.14); --muted: #B8C0DA; --bg: #FFFFFF; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) svg { --ink: #F4F5F8; --axis: #7F8AA8; --grid: #252B3D; --primary: #6B93FF; --primary-soft: #1B2542; --answer: #FF6B6B; --answer-soft: rgba(255,107,107,.18); --muted: #56607A; --bg: #0F131D; } }
  :root[data-theme='dark'] svg { --ink: #F4F5F8; --axis: #7F8AA8; --grid: #252B3D; --primary: #6B93FF; --primary-soft: #1B2542; --answer: #FF6B6B; --answer-soft: rgba(255,107,107,.18); --muted: #56607A; --bg: #0F131D; }
  @media (prefers-reduced-motion: reduce) { svg * { transition: none !important; } }
  .lbl { font-size: 13px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  .var { font-family: 'KaTeX_Math', Georgia, serif; font-style: italic; font-size: 15px; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  .mut { font-size: 12px; fill: var(--axis); }
  .ax { stroke: var(--axis); stroke-width: 1.25; fill: none; }
  .grd { stroke: var(--grid); stroke-width: 1; fill: none; }
  .main { stroke: var(--primary); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .aux { stroke: var(--axis); stroke-width: 1.25; stroke-dasharray: 4 3; fill: none; }
  .soft { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 1.5; stroke-linejoin: round; }
  .pt { fill: var(--primary); stroke: var(--bg); stroke-width: 1.5; }
  .hole { fill: var(--bg); stroke: var(--primary); stroke-width: 2; }
  svg[data-focus] [class*='f-'] { opacity: .30; transition: opacity .15s, stroke .15s; }
  svg[data-focus~="alpha"] .f-alpha { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="alpha"] text.f-alpha, svg[data-focus~="alpha"] .f-alpha text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="alpha"] .f-alpha.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
  svg[data-focus~="cos2a"] .f-cos2a { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="cos2a"] text.f-cos2a, svg[data-focus~="cos2a"] .f-cos2a text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="cos2a"] .f-cos2a.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
  svg[data-focus~="half"] .f-half { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="half"] text.f-half, svg[data-focus~="half"] .f-half text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="half"] .f-half.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
  svg[data-focus~="mirror"] .f-mirror { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="mirror"] text.f-mirror, svg[data-focus~="mirror"] .f-mirror text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="mirror"] .f-mirror.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
  svg[data-focus~="result"] .f-result { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="result"] text.f-result, svg[data-focus~="result"] .f-result text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="result"] .f-result.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
  svg[data-focus~="sin2a"] .f-sin2a { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="sin2a"] text.f-sin2a, svg[data-focus~="sin2a"] .f-sin2a text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="sin2a"] .f-sin2a.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
  svg[data-focus~="split_angle"] .f-split_angle { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="split_angle"] text.f-split_angle, svg[data-focus~="split_angle"] .f-split_angle text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="split_angle"] .f-split_angle.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
  svg[data-focus~="terms"] .f-terms { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="terms"] text.f-terms, svg[data-focus~="terms"] .f-terms text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="terms"] .f-terms.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
  svg[data-focus~="three_alpha"] .f-three_alpha { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="three_alpha"] text.f-three_alpha, svg[data-focus~="three_alpha"] .f-three_alpha text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="three_alpha"] .f-three_alpha.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
  svg[data-focus~="value"] .f-value { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="value"] text.f-value, svg[data-focus~="value"] .f-value text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="value"] .f-value.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
</style>
<defs><marker id='ax' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M1 1.5L9 5L1 8.5z' fill='var(--axis)'/></marker></defs>
