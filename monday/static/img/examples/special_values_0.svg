  svg[data-focus~="p45"] .f-p45 { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="p45"] text.f-p45, svg[data-focus~="p45"] .f-p45 text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="p45"] .f-p45.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
  svg[data-focus~="p60"] .f-p60 { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="p60"] text.f-p60, svg[data-focus~="p60"] .f-p60 text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="p60"] .f-p60.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
  svg[data-focus~="p90"] .f-p90 { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="p90"] text.f-p90, svg[data-focus~="p90"] .f-p90 text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="p90"] .f-p90.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
  svg[data-focus~="result"] .f-result { opacity: 1; stroke: var(--answer); }
  svg[data-focus~="result"] text.f-result, svg[data-focus~="result"] .f-result text { stroke: none; fill: var(--answer); font-weight: 700; }
  svg[data-focus~="result"] .f-result.f-fill { fill: var(--answer-soft); stroke: var(--answer); }
</style>
