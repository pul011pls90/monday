# Render.com blueprint: New → Blueprint → pick this repository.
services:
  - type: web
    name: monday
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pybabel compile -d translations
    startCommand: flask --app app db upgrade && gunicorn app:app -c gunicorn.conf.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MONDAY_SECRET_KEY
        generateValue: true
      - key: MONDAY_DEBUG
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: PUBLIC_SITE_ENABLED
        value: "1"
      - key: SUBSCRIPTION_REQUIRED
        value: "0"
      - key: SEED_DEMO
        value: "0"
      - key: DATA_FIXES
        value: "0"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY   # the free plan has 512 MB: one worker
        value: "1"
