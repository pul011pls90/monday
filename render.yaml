# Render.com blueprint: New → Blueprint → pick this repository.
services:
  - type: web
    name: monday
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pybabel compile -d translations
    startCommand: gunicorn app:app -c gunicorn.conf.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MONDAY_SECRET_KEY
        generateValue: true
      - key: MONDAY_DEBUG
        value: "0"
      - key: WEB_CONCURRENCY   # the free plan has 512 MB: one worker
        value: "1"
