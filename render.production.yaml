# Production on Render (Frankfurt, paid plans, PostgreSQL, a disk for photos).
# Render → New → Blueprint → this repository → Blueprint path: render.production.yaml
# It creates a NEW service and database; the free demo (render.yaml) keeps running until you delete it.
# Cost at today's prices: web 0.5 CPU $7 + Postgres $6 + disk 5 GB ≈ $1.25 → about $14–16 a month.
services:
  - type: web
    name: monday-app
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb          # «Less than 1 CPU», never sleeps. For Monday-test peaks: 1c-2g ($25)
    buildCommand: pip install -r requirements.txt && pybabel compile -d translations
    startCommand: gunicorn app:app -c gunicorn.conf.py
    healthCheckPath: /login
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5                # can be increased later, never decreased
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: monday-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: MONDAY_SECRET_KEY
        generateValue: true
      - key: MONDAY_DEBUG
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: SEED_DEMO          # no demo accounts in production
        value: "0"
      - key: ADMIN_EMAIL        # the first admin, asked once when the Blueprint is created
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONDAY_TEST_ALWAYS_OPEN   # the Monday test only on Mondays 19:00–24:00
        value: "0"
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: monday-db
    region: frankfurt
    plan: 0.1c-256mb           # $6: 1 GB storage included (+$0.30 per extra GB)
    databaseName: monday
    user: monday
    ipAllowList: []            # only the web service (private network) can connect
