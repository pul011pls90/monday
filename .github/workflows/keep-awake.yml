# Keeps the free Render server awake: Render puts it to sleep after 15 minutes without visitors,
# and the next visitor then waits about a minute. This opens the site every 5 minutes instead.
# GitHub may run scheduled jobs a few minutes late; that is fine for a 15-minute window.
# To stop it: GitHub → Actions → "Keep site awake" → ⋯ → Disable workflow.
name: Keep site awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # "Run workflow" button for a manual check

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Open the site
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 --retry 2 https://monday-k3zr.onrender.com/login)
          echo "Monday answered with HTTP $code"
          test "$code" = "200"
